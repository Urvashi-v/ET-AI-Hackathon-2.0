<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Field · Asset &amp; Operations Brain</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    /* Designed for the actual conditions: gloves, noise, bright sun or a dark
       plant. Large tap targets, high contrast, answer first. */
    body { font-size: 15px; }
    .field-shell { max-width: 620px; margin: 0 auto; padding: 12px 12px 96px; }
    .field-head { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
    .asset-hero {
      background: var(--bg-1); border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg); padding: 14px;
    }
    .asset-hero .tag { font-size: 1.5rem; padding: 5px 12px; }
    .big-input {
      font-size: 1.05rem; padding: 14px 14px; min-height: 56px;
      border-radius: var(--radius-lg);
    }
    .big-btn {
      font-size: 1rem; min-height: 54px; padding: 0 20px; width: 100%;
      border-radius: var(--radius-lg); justify-content: center;
    }
    .answer-first {
      background: var(--bg-2); border-left: 3px solid var(--accent);
      border-radius: var(--radius); padding: 14px; font-size: 1.02rem; line-height: 1.55;
    }
    .evidence-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .evidence-item:last-child { border-bottom: 0; }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-row button { min-height: 44px; white-space: nowrap; }
    .sticky-ask {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--bg-1); border-top: 1px solid var(--line-strong);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .sticky-ask form { max-width: 620px; margin: 0 auto; display: flex; gap: 8px; }
    .sticky-ask input { flex: 1; }
    .sync-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 11px; border-radius: var(--radius);
      background: var(--bg-2); border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .sync-bar .spacer { flex: 1; }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fg-2); flex: none; }
    .sync-bar.online  .sync-dot { background: var(--ok); }
    .sync-bar.offline .sync-dot { background: var(--warn); }
    .sync-bar.offline { border-color: var(--warn); background: var(--warn-bg); }
    .sync-detail { padding: 10px 11px; margin: -6px 0 12px; font-size: 0.78rem;
                   background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }
    .sync-detail ul { margin: 6px 0 0; padding-left: 18px; }

    .dossier { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .dossier details {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-1);
    }
    .dossier summary {
      padding: 14px; cursor: pointer; font-weight: 600; font-size: 0.92rem;
      display: flex; align-items: center; gap: 8px; min-height: 48px;
    }
    .dossier summary .count { color: var(--fg-2); font-weight: 400; font-size: 0.8rem; }
    .dossier details[open] summary { border-bottom: 1px solid var(--line); }
    .dossier details > div { padding: 12px 14px; }
    .cached-badge { font-size: 0.7rem; color: var(--warn); }

    @media (min-width: 900px) { .field-shell { padding-bottom: 110px; } }
  </style>
</head>
<body>
  <div class="field-shell">
    <div class="field-head">
      <div class="brand-mark">AB</div>
      <div style="flex:1">
        <div style="font-weight:650">Field assistant</div>
        <div class="small dim">Point of need · <span data-role>field technician</span></div>
      </div>
      <a class="btn small" href="index.html">Desk view</a>
    </div>

    <!-- Connectivity and cache scope. Stated, not implied: a technician needs to
         know whether what they are reading came from the plant or from their
         phone, and how old it is. -->
    <div class="sync-bar" data-sync>
      <span class="sync-dot" data-sync-dot></span>
      <span class="small" data-sync-state>Checking…</span>
      <span class="spacer"></span>
      <button type="button" class="small ghost" data-sync-detail-toggle>Cache</button>
    </div>
    <div class="sync-detail" data-sync-detail hidden></div>

    <!-- Asset context: the fastest possible entry is the tag on the nameplate. -->
    <section class="asset-hero" data-asset-hero>
      <div class="small dim">Loading asset context…</div>
    </section>

    <section class="alerts" data-alerts hidden>
      <div class="alerts-head">
        <strong data-alerts-count>Alerts</strong>
        <button type="button" class="small ghost" data-alerts-refresh>Refresh</button>
      </div>
      <div data-alerts-list></div>
    </section>

    <div class="chip-row" style="margin:14px 0" data-quick></div>

    <!-- Asset dossier. Each panel is collapsed by default: on a phone at the
         machine, four expanded panels is four screens of scrolling before the
         ask box. Counts are on the summary so the technician knows what is
         inside without opening it. -->
    <section class="dossier" data-dossier-panels hidden>
      <details data-panel="workorders">
        <summary>Work orders <span class="count" data-count-wo></span></summary>
        <div data-wo-list></div>
      </details>
      <details data-panel="incidents">
        <summary>Incidents <span class="count" data-count-inc></span></summary>
        <div data-inc-list></div>
      </details>
      <details data-panel="compliance">
        <summary>Safety &amp; compliance <span class="count" data-count-comp></span></summary>
        <div data-comp-list></div>
      </details>
      <details data-panel="rca">
        <summary>RCA evidence <span class="count" data-count-rca></span></summary>
        <div data-rca-list></div>
      </details>
      <details data-panel="pid">
        <summary>P&amp;ID <span class="count" data-count-pid></span></summary>
        <div data-pid-view></div>
      </details>
    </section>

    <section data-result></section>
  </div>

  <div class="sticky-ask">
    <form data-ask>
      <input class="big-input" type="text" name="question" required
             placeholder="Ask about this asset…" autocomplete="off">
      <!-- Rendered only when the browser genuinely has speech recognition. A
           microphone button that does nothing is worse than no button. -->
      <button type="button" class="big-btn ghost" data-voice hidden
              style="width:auto;padding:0 16px" aria-label="Dictate question">🎤</button>
      <button class="primary" type="submit" style="min-height:56px;padding:0 22px">Ask</button>
    </form>
  </div>

  <script type="module">
    import { api, streamQuery, subscribeEvents } from './js/api.js';
    import * as offline from './js/offline.js';
    import * as voice from './js/voice.js';
    import { DrawingViewer } from './js/drawingviewer.js';
    import {
      esc, provBadge, renderError, renderEmpty, renderCapability,
      confidenceBand, fmtDate, tagChip, qs,
    } from './js/ui.js';

    const $ = (sel) => document.querySelector(sel);
    let assetTag = qs('asset');

    const QUICK = [
      'Why does this keep failing?',
      'What did we do last time?',
      'How do I isolate it safely?',
      'Do I need a permit?',
      'What is the discharge pressure limit?',
    ];
    $('[data-quick]').innerHTML = QUICK
      .map((q) => `<button class="small" data-q="${esc(q)}">${esc(q)}</button>`).join('');
    $('[data-quick]').addEventListener('click', (event) => {
      const button = event.target.closest('[data-q]');
      if (!button) return;
      $('[name="question"]').value = button.dataset.q;
      ask(button.dataset.q);
    });

    async function loadAsset() {
      const node = $('[data-asset-hero]');
      try {
        if (!assetTag) {
          const { items } = await api.assets({ limit: 1 });
          assetTag = items[0]?.canonical_tag;
        }
        if (!assetTag) {
          renderEmpty(node, {
            title: 'No asset context',
            body: 'Nothing has been ingested yet, so there is no asset to work on.',
          });
          return;
        }
        const detail = await api.asset(assetTag);
        const asset = detail.asset;
        const lastEvent = [...detail.work_orders, ...detail.incidents]
          .sort((a, b) => String(b.opened_on || b.occurred_on || '').localeCompare(
            String(a.opened_on || a.occurred_on || '')))[0];

        node.innerHTML = `
          <div class="row" style="justify-content:space-between">
            <span class="tag">${esc(asset.canonical_tag)}</span>
            ${provBadge(asset.data_class)}
          </div>
          <div style="margin-top:8px;color:var(--fg-1)">${esc(asset.class_label || asset.tag_kind)}</div>
          ${asset.functional_location
            ? `<div class="small dim" style="margin-top:3px">Position ${esc(asset.functional_location)}</div>` : ''}
          <div class="row" style="margin-top:12px;gap:14px">
            <div><div class="small dim">Work orders</div><div class="mono" style="font-size:1.2rem">${detail.work_orders.length}</div></div>
            <div><div class="small dim">Incidents</div><div class="mono" style="font-size:1.2rem">${detail.incidents.length}</div></div>
            <div><div class="small dim">Documents</div><div class="mono" style="font-size:1.2rem">${asset.document_count}</div></div>
          </div>
          ${detail.siblings.length ? `
            <div style="margin-top:12px">
              <div class="small dim">Standby / parallel train</div>
              <div class="row tight" style="margin-top:5px">
                ${detail.siblings.map((s) => `<a class="tag" href="field.html?asset=${encodeURIComponent(s.canonical_tag)}">${esc(s.canonical_tag)}</a>`).join('')}
              </div>
            </div>` : ''}
          ${lastEvent ? `
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
              <div class="small dim">Last recorded event · ${fmtDate(lastEvent.opened_on || lastEvent.occurred_on)}</div>
              <div style="margin-top:4px">${esc(lastEvent.description || lastEvent.title || '')}</div>
              ${lastEvent.as_found ? `<div class="small" style="margin-top:5px"><span class="dim">as-found:</span> ${esc(lastEvent.as_found)}</div>` : ''}
            </div>` : ''}`;

        loadNotifications();
      } catch (error) {
        renderError(node, error, { title: 'Cannot load asset' });
      }
    }

    async function loadNotifications() {
      try {
        const data = await api.notifications({ asset_tag: assetTag, limit: 5 });
        if (!data.items.length) return;
        const banner = document.createElement('section');
        banner.style.marginTop = '12px';
        banner.innerHTML = data.items.map((n) => `
          <div class="capability" style="border-color:var(--warn);border-style:solid">
            <h4><span class="badge warn">${esc(n.severity)}</span> ${esc(n.title)}</h4>
            <p>${esc(n.message)}</p>
            <p class="small dim">${esc(n.reason)}</p>
          </div>`).join('');
        $('[data-asset-hero]').after(banner);
      } catch { /* the panel is optional; its absence must not break the page */ }
    }

    async function ask(question) {
      const node = $('[data-result]');
      node.innerHTML = `
        <div class="card"><div class="card-body">
          <div class="row"><span class="spinner"></span><span data-progress-text>Understanding the question…</span></div>
        </div></div>`;
      const progress = node.querySelector('[data-progress-text]');
      const citations = [];

      try {
        await streamQuery({
          question,
          user_ctx: { role: 'field_technician', asset_tag: assetTag },
        }, {
          intent: (e) => { progress.textContent = `Intent: ${e.intent}. Searching…`; },
          retrieval: (e) => {
            if (e.state === 'available' && e.candidates) {
              progress.textContent = `${e.strategy}: found ${e.candidates} candidates…`;
            }
          },
          citation: (e) => citations.push(e),
          answer: (e) => {
            node.innerHTML = `<div class="answer-first">${esc(e.text)}</div>` + node.innerHTML;
          },
          generation: (e) => {
            if (e.state !== 'available') {
              node.dataset.generation = renderCapability(e);
            }
          },
          confidence: (e) => renderResult(node, e, citations),
          referral: (e) => { node.dataset.referral = JSON.stringify(e); },
          done: () => { if (!node.querySelector('[data-final]')) renderResult(node, null, citations); },
        });
      } catch (error) {
        renderError(node, error, { title: 'Could not answer' });
      }
    }

    function renderResult(node, confidence, citations) {
      const band = confidence ? confidenceBand(confidence.score) : 'low';
      const pct = confidence ? Math.round(confidence.score * 100) : 0;
      const referral = node.dataset.referral ? JSON.parse(node.dataset.referral) : null;
      const generation = node.dataset.generation || '';

      // Answer first, evidence second, sources third — never a paragraph of
      // preamble before the number a technician came for.
      node.innerHTML = `
        <div data-final>
          ${generation}
          ${referral ? `
            <div class="card" style="margin-top:12px;border-color:var(--warn)">
              <div class="card-body">
                <div class="row"><span class="badge warn">Cannot confirm</span></div>
                <p style="margin-top:8px">${esc(referral.reason)}</p>
                <dl class="kv small">
                  <dt>Should be in</dt><dd>${esc(referral.expected_document)}</dd>
                  <dt>Ask</dt><dd>${esc(referral.owner_role.replaceAll('_', ' '))}</dd>
                </dl>
              </div>
            </div>` : ''}

          ${confidence ? `
            <div class="card" style="margin-top:12px">
              <div class="card-body">
                <div class="row" style="justify-content:space-between">
                  <span class="small dim">Confidence</span>
                  <div class="confidence">
                    <div class="confidence-bar"><div class="confidence-fill ${band}" style="width:${pct}%"></div></div>
                    <span class="mono">${pct}%</span>
                  </div>
                </div>
                <p class="small muted" style="margin:8px 0 0">${esc(confidence.explanation)}</p>
              </div>
            </div>` : ''}

          <div class="card" style="margin-top:12px">
            <div class="card-head"><h2>Evidence (${citations.length})</h2></div>
            <div class="card-body">
              ${citations.length ? citations.map((c) => `
                <div class="evidence-item">
                  <div class="row tight">
                    <span class="badge neutral no-dot mono">${esc(c.marker)}</span>
                    <strong style="font-size:0.92rem">${esc(c.doc_title)}</strong>
                  </div>
                  <div class="row tight small dim" style="margin-top:4px">
                    ${provBadge(c.data_class)}
                    <span>${esc(String(c.doc_type).replaceAll('_', ' '))}</span>
                    ${c.page ? `<span>page ${c.page}</span>` : ''}
                  </div>
                  <p class="small" style="margin:8px 0 0;color:var(--fg-1)">${esc(c.snippet.slice(0, 400))}</p>
                </div>`).join('')
                : '<p class="small muted">No supporting passages were found for this question.</p>'}
            </div>
          </div>

          <div class="row" style="margin-top:12px;gap:8px">
            <a class="btn big-btn" style="flex:1" href="graph.html?asset=${encodeURIComponent(assetTag || '')}">Show on graph</a>
            <a class="btn big-btn" style="flex:1" href="reliability.html?asset=${encodeURIComponent(assetTag || '')}">Full history</a>
          </div>
        </div>`;
      delete node.dataset.referral;
      delete node.dataset.generation;
    }

    $('[data-ask]').addEventListener('submit', (event) => {
      event.preventDefault();
      const question = String(new FormData(event.currentTarget).get('question') || '').trim();
      if (question) ask(question);
    });

    loadAsset();

    // ------------------------------------------------------- notifications

    /**
     * Alerts for the technician standing in front of the machine.
     *
     * Every row here is a stored notification raised by the backend event
     * pipeline — a matcher ran against real records and concluded something.
     * Nothing is generated in this page, nothing is produced on a timer, and
     * the panel stays hidden when there is nothing to say rather than showing
     * a reassuring "all clear" the system has not actually established.
     *
     * Filtered to this role by default: the compliance gap belongs to the HSE
     * officer, and burying the superseded-procedure warning underneath it is
     * how the one that matters at the machine gets missed.
     */
    const ALERT_TONE = { critical: 'danger', high: 'danger', medium: 'warn', low: 'info', info: 'info' };

    async function loadAlerts(assetTag) {
      const node = $('[data-alerts-list]');
      try {
        const params = { unacknowledged_only: true, limit: 20 };
        if (assetTag) params.asset_tag = assetTag;
        const data = await api.notifications(params);
        renderAlerts(data);
      } catch (error) {
        // A failed alert fetch must not take the page down; the copilot below
        // still works and is the reason the technician opened this.
        $('[data-alerts]').hidden = false;
        node.innerHTML = `<div class="alert"><div class="alert-body">
          <strong>Alerts unavailable</strong>
          <div class="small dim">${esc(error.message || 'Could not reach the notification store.')}</div>
        </div></div>`;
      }
    }

    function renderAlerts(data) {
      const node = $('[data-alerts-list]');
      const items = data.items || [];
      $('[data-alerts]').hidden = items.length === 0;
      if (!items.length) return;

      $('[data-alerts-count]').textContent =
        `${items.length} alert${items.length === 1 ? '' : 's'}`;
      node.innerHTML = items.map((n) => `
        <article class="alert ${esc(ALERT_TONE[n.severity] || 'info')}">
          <div class="alert-body">
            <div class="row tight">
              <span class="badge ${esc(ALERT_TONE[n.severity] || 'info')}">${esc(n.severity)}</span>
              <strong class="small">${esc(n.title)}</strong>
            </div>
            <div class="small" style="margin-top:4px">${esc(n.message)}</div>
            <div class="small dim" style="margin-top:4px">${esc(n.reason)}</div>
            <div class="row tight" style="margin-top:7px">
              <span class="small dim mono">${esc(n.kind || '')}</span>
              ${n.asset_tag ? `<span class="badge neutral no-dot mono">${esc(n.asset_tag)}</span>` : ''}
              <span class="spacer"></span>
              <button type="button" class="small ghost" data-ack="${n.notification_id}">Acknowledge</button>
            </div>
          </div>
        </article>`).join('');
    }

    document.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-ack]');
      if (button) {
        button.disabled = true;
        button.textContent = 'Acknowledging…';
        try {
          await api.acknowledge(button.dataset.ack);
          await loadAlerts(currentAssetTag());
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Acknowledge';
        }
        return;
      }
      if (event.target.closest('[data-alerts-refresh]')) {
        await loadAlerts(currentAssetTag());
      }
    });

    function currentAssetTag() {
      return new URLSearchParams(window.location.search).get('asset') || null;
    }

    loadAlerts(currentAssetTag());

    // Live delivery. The store is the source of truth and the stream is the push
    // half of the same fact, so an arriving event re-reads rather than trusting
    // the payload -- which also means a missed event self-heals on the next one.
    subscribeEvents({
      'notification.raised': () => loadAlerts(currentAssetTag()),
    });


    // ------------------------------------------------------ day 5: field kit

    /**
     * Connectivity, last synchronisation and exactly what is held offline.
     *
     * Three separate facts, shown separately, because they answer different
     * questions: can I reach the plant, how old is what I am looking at, and
     * what do I still have if I lose signal. Collapsing them into one "offline
     * ready" badge would imply the whole system fits on the phone.
     */
    function renderSync(online) {
      const bar = $('[data-sync]');
      const scope = offline.describe();
      bar.classList.toggle('online', online);
      bar.classList.toggle('offline', !online);

      const last = scope.lastSync
        ? `last sync ${new Date(scope.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
        : 'nothing cached yet';
      $('[data-sync-state]').textContent = online
        ? `Online · ${last}`
        : `Offline · showing cached data · ${last}`;

      $('[data-sync-detail]').innerHTML = `
        <strong>Cached on this device</strong>
        <div class="dim">${scope.count} item(s), kept up to ${scope.maxAgeHours} hours.
          Only content this browser has already loaded online. Retrieval, the graph,
          RCA and compliance all run on the server — they are not available offline.</div>
        ${scope.count ? `<ul>${scope.items.slice(0, 10).map((i) => `
          <li><span class="mono">${esc(i.label)}</span>
            <span class="dim">${esc(offline.ageLabel(Date.now() - Date.parse(i.cached_at)))}</span></li>`).join('')}</ul>`
          : ''}`;
    }

    $('[data-sync-detail-toggle]').addEventListener('click', () => {
      const node = $('[data-sync-detail]');
      node.hidden = !node.hidden;
      if (!node.hidden) renderSync(navigator.onLine);
    });

    offline.watchConnectivity((online) => {
      renderSync(online);
      // Coming back online: refresh what is on screen rather than leaving the
      // technician looking at cached data with a green dot above it.
      if (online && currentAssetTag()) loadDossier(currentAssetTag());
    });

    // --- voice ---------------------------------------------------------------
    const voiceState = voice.describe();
    if (voiceState.available) {
      const button = $('[data-voice]');
      button.hidden = false;
      button.title = voiceState.privacyNote || 'Dictate';
      let session = null;
      button.addEventListener('click', async () => {
        const input = $('[data-ask] [name="question"]');
        if (session) { session.stop(); session = null; button.textContent = '🎤'; return; }
        button.textContent = '⏹';
        input.placeholder = 'Listening…';
        session = voice.listen({ onPartial: (text) => { input.value = text; } });
        try {
          const text = await session.promise;
          if (text) { input.value = text; ask(text); }
        } catch (error) {
          input.placeholder = error.message;
        } finally {
          session = null;
          button.textContent = '🎤';
          setTimeout(() => { input.placeholder = 'Ask about this asset…'; }, 4000);
        }
      });
    }

    // --- asset dossier -------------------------------------------------------

    /**
     * Everything the technician needs about the asset in front of them.
     *
     * Each panel goes through the offline cache, so the whole dossier survives a
     * lost signal — and each says whether what it is showing came from the plant
     * or from the phone.
     */
    async function loadDossier(assetTag) {
      if (!assetTag) return;
      $('[data-dossier-panels]').hidden = false;

      await Promise.all([
        panel(`rca:${assetTag}`, `RCA · ${assetTag}`,
          () => api.rca({ asset_tag: assetTag, failure_description: 'field inspection' }),
          (data, note) => {
            $('[data-count-wo]').textContent = `(${data.related_work_orders.length})`;
            $('[data-count-inc]').textContent = `(${data.related_incidents.length})`;
            $('[data-count-rca]').textContent = `(${data.candidate_causes.length})`;
            renderWorkOrders(data.related_work_orders, note);
            renderIncidents(data.related_incidents, note);
            renderRca(data, note);
          }),
        panel(`compliance:${assetTag}`, `Compliance · ${assetTag}`,
          () => api.complianceEvaluate({ asset_tag: assetTag }),
          (data, note) => {
            $('[data-count-comp]').textContent = `(${data.gaps} gap${data.gaps === 1 ? '' : 's'})`;
            renderCompliance(data, note);
          }),
        panel(`drawing:${assetTag}`, `P&ID · ${assetTag}`,
          () => api.locateAsset(assetTag),
          (data) => {
            $('[data-count-pid]').textContent = data.appearances.length
              ? `(${data.drawings} drawing)` : '(not on a drawing)';
            renderPid(assetTag, data);
          }),
      ]);
      renderSync(navigator.onLine);
    }

    /** Run one panel through the cache and label where its data came from. */
    async function panel(key, label, loader, render) {
      try {
        const result = await offline.through(key, loader, { label });
        const note = result.source === 'cached'
          ? `<div class="cached-badge">Cached ${offline.ageLabel(result.ageMs)} — not live</div>`
          : '';
        render(result.payload, note);
      } catch (error) {
        // Which panel failed and why, rather than a blank section that reads as
        // "this asset has none of these".
        const target = { [`rca:${currentAssetTag()}`]: '[data-rca-list]',
                         [`compliance:${currentAssetTag()}`]: '[data-comp-list]',
                         [`drawing:${currentAssetTag()}`]: '[data-pid-view]' }[key];
        if (target && $(target)) {
          $(target).innerHTML = `<div class="small dim">${esc(error.message || 'Unavailable.')}</div>`;
        }
      }
    }

    function renderWorkOrders(orders, note) {
      $('[data-wo-list]').innerHTML = note + (orders.length ? orders.slice(0, 8).map((w) => `
        <div class="evidence-item">
          <div class="row tight">
            <span class="badge ${w.wo_type === 'CORRECTIVE' ? 'warn' : 'neutral'} no-dot mono">${esc(w.wo_id)}</span>
            <span class="small dim">${esc(w.opened_on || '')}</span>
            ${w.downtime_hours ? `<span class="small dim">${w.downtime_hours} h down</span>` : ''}
          </div>
          <div class="small" style="margin-top:3px">${esc(w.description || '')}</div>
          ${w.as_found ? `<div class="small dim" style="margin-top:2px">Found: ${esc(w.as_found)}</div>` : ''}
        </div>`).join('') : '<div class="small dim">No work orders recorded.</div>');
    }

    function renderIncidents(incidents, note) {
      $('[data-inc-list]').innerHTML = note + (incidents.length ? incidents.map((i) => `
        <div class="evidence-item">
          <div class="row tight">
            <span class="badge danger no-dot mono">${esc(i.incident_id)}</span>
            <span class="small dim">${esc(i.occurred_on || '')}</span>
            <span class="badge neutral no-dot">${esc(i.investigation_status || '')}</span>
          </div>
          <div class="small" style="margin-top:3px">${esc(i.root_cause || i.immediate_cause || '')}</div>
        </div>`).join('') : '<div class="small dim">No incidents recorded.</div>');
    }

    function renderRca(rca, note) {
      const causes = rca.candidate_causes || [];
      $('[data-rca-list]').innerHTML = note + (rca.causal_analysis_abstained
        ? `<div class="small dim">${esc(rca.causal_analysis_reason || '')}</div>`
        : causes.slice(0, 4).map((c, i) => `
          <div class="evidence-item">
            <div class="row tight">
              <span class="badge ${i === 0 ? 'warn' : 'neutral'} no-dot mono">${i + 1}</span>
              <strong class="small">${esc(c.label)}</strong>
            </div>
            <div class="small dim" style="margin-top:3px">${esc(c.rationale)}</div>
          </div>`).join(''))
        + (rca.open_corrective_actions?.length ? `
          <div class="notice warn" style="margin-top:10px">
            <strong>${rca.open_corrective_actions.length} open corrective action(s).</strong>
            ${rca.open_corrective_actions.map((a) =>
              `${esc(a.capa_id)}: ${esc(a.action || '')}`).join('; ')}
          </div>` : '');
    }

    function renderCompliance(data, note) {
      const gaps = (data.findings || []).filter((f) => f.state === 'gap');
      $('[data-comp-list]').innerHTML = note + `
        <div class="row tight small" style="margin-bottom:8px">
          <span class="badge ok no-dot">${data.satisfied} satisfied</span>
          <span class="badge danger no-dot">${data.gaps} gaps</span>
          <span class="badge warn no-dot">${data.needs_verification} to verify</span>
          <span class="badge neutral no-dot">${data.not_evaluable} not evaluable</span>
        </div>
        ${gaps.length ? gaps.slice(0, 5).map((f) => `
          <div class="evidence-item">
            <div class="row tight">
              <span class="badge danger no-dot mono">${esc(f.req_id)}</span>
              <span class="small dim">${esc(f.source_standard)}</span>
            </div>
            <div class="small" style="margin-top:3px">${esc(f.obligation_text)}</div>
            <div class="small dim" style="margin-top:2px">${esc(f.reason)}</div>
          </div>`).join('') : '<div class="small dim">No unmet obligations found for this asset.</div>'}`;
    }

    async function renderPid(assetTag, located) {
      const node = $('[data-pid-view]');
      if (!located.appearances?.length) {
        node.innerHTML = `<div class="small dim">${esc(located.detail || 'Not on any digitised drawing.')}</div>`;
        return;
      }
      // The viewer needs the detections endpoint, which needs a connection. The
      // location itself is cached, so offline the technician still learns which
      // sheet and roughly where.
      if (!navigator.onLine) {
        const a = located.appearances[0];
        node.innerHTML = `<div class="small">
          Appears on <strong>${esc(a.doc_title)}</strong> page ${a.page}
          at ${a.x0.toFixed(0)}, ${a.y0.toFixed(0)} pt.
          <span class="dim">The drawing image needs a connection.</span></div>`;
        return;
      }
      const viewer = new DrawingViewer(node);
      const first = located.appearances[0];
      await viewer.load(first.doc_id, first.page, { highlight: assetTag });
    }

    // Load the dossier for whatever asset the page was opened on.
    if (currentAssetTag()) loadDossier(currentAssetTag());

  </script>
</body>
</html>
